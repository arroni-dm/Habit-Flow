<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        function ensureWritableFetch() {
          try {
            var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (desc && typeof desc.get === 'function' && typeof desc.set !== 'function' && desc.configurable !== false) {
              var origGet = desc.get;
              var assignedFetch = null;
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: desc.enumerable !== false,
                get: function () {
                  return assignedFetch || origGet.call(window);
                },
                set: function (fn) {
                  if (typeof fn === 'function') {
                    assignedFetch = fn;
                  }
                },
              });
            }
          } catch (_err) {}
        }
        ensureWritableFetch();
        document.addEventListener('readystatechange', ensureWritableFetch);
        window.addEventListener(
          'error',
          function (event) {
            var src = String((event && event.filename) || '');
            var msg = String((event && event.message) || '');
            if (
              src.indexOf('chrome-extension://') === 0 ||
              src.indexOf('moz-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch of #<Window>') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <title>HabitFlow</title>
    <meta name="description" content="Personal productivity and multi-user habit tracking platform with daily schedules, streak analytics, goal tracking, weekly reviews, and CSV exports." />
